<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Finance Manager</title>

<style>
body{
    margin:0;
    background:#10131D;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.card{
    width:320px;
    background:#131827;

    border-radius:30px;

    text-align:center;

    padding:40px 25px;

    color:white;
}

.logo{
    width:120px;
    border-radius:25px;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
    line-height:1.4;
}

.version{
    display:inline-block;

    margin-top:15px;

    background:#4a2a14;
    color:#ff9a3d;

    padding:6px 12px;

    border-radius:15px;

    font-size:14px;
}

.welcome{
    margin-top:60px;
    font-size:28px;
    font-weight:bold;
}

.desc{
    margin-top:20px;
    color:#c7c7c7;
    line-height:1.7;
    font-size:16px;
}

.install-btn{
    display:block;

    margin-top:50px;

    background:#F28B32;

    text-decoration:none;

    color:black;

    font-weight:bold;

    font-size:18px;

    padding:20px;

    border-radius:18px;
}
</style>

</head>
<body>

<div class="card">

    <img src="logo.png" class="logo">

    <div class="title">
        PERSONAL FINANCE<br>
        MANAGER
    </div>

    <div class="version">
        1.0 Alpha
    </div>

    <div class="welcome">
        Witaj!
    </div>

    <div class="desc">
        Zarządzaj swoimi wydatkami<br>
        w prosty i wygodny sposób.
    </div>

    <a class="install-btn"
       href="BudgetManager_v1-alpha.apk">
        ZAINSTALUJ
    </a>

</div>

</body>
</html>
