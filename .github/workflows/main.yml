name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          cd BudgetManager_mobileV1
          ls -la
          cat buildozer.spec

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip git
          pip3 install buildozer cython

      - name: Build APK
        run: |
          cd BudgetManager_mobileV1
          buildozer android debug
