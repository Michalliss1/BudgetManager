name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        workdir: BudgetManager_mobileV1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BudgetManager-APK
        path: BudgetManager_mobileV1/bin/*.apk
