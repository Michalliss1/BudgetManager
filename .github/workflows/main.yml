```yaml
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            zip \
            unzip \
            git \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade buildozer cython
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Buildozer
        run: |
          buildozer --version

      - name: Build APK
        run: |
          cd BudgetManager_mobileV1
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Log
          path: BudgetManager_mobileV1/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager-APK
          path: BudgetManager_mobileV1/bin/*.apk
          if-no-files-found: error
```
